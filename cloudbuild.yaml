steps:
  # 1. Construir la imagen de Docker usando el Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-east1-docker.pkg.dev/project-afa61973-82ee-4f08-99f/risky-bills-backend/risky-bills-backend:latest', '.']

  # 2. Subir la imagen a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-east1-docker.pkg.dev/project-afa61973-82ee-4f08-99f/risky-bills-backend/risky-bills-backend:latest']

  # 3. Desplegar automáticamente en Cloud Run (CORREGIDO CON GCLOUD)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    args:
      - 'gcloud'
      - 'run'
      - 'deploy'
      - 'mi-servicio-backend'
      - '--image=us-east1-docker.pkg.dev/project-afa61973-82ee-4f08-99f/risky-bills-backend/risky-bills-backend:latest'
      - '--region=us-east1'
      - '--platform=managed'
      - '--allow-unauthenticated'

images:
  - 'us-east1-docker.pkg.dev/project-afa61973-82ee-4f08-99f/risky-bills-backend/risky-bills-backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY